[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-partitioner"
version = "1.0.0"
description = "Split a CSV into one file per distinct column value"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
csv-partitioner = "csv_partitioner.cli:main"

[tool.setuptools.packages.find]
include = ["csv_partitioner*"]
